name: publier

# Une etiquette de version suffit : git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Dalamud n'est pas sur NuGet : on prend la distribution officielle.
      - name: Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev" -Force

      - name: Compiler
        run: dotnet build -c Release CodexOlympia/CodexOlympia.csproj

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          files: CodexOlympia/bin/Release/CodexOlympia/latest.zip
          generate_release_notes: true
